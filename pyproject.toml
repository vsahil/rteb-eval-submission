[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rteb"
version = "0.1.0"
description = "RTEB: Retrieval Text Embedding Benchmark"
readme = "README.md"
authors = [{name = "RTEB authors"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "huggingface-hub>=0.16.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
]

[project.urls]
Repository = "https://github.com/vsahil/rteb-eval-submission"
Issues = "https://github.com/vsahil/rteb-eval-submission/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
rteb-evaluate = "rteb.evaluate:main"
rteb-evaluate-agentic-coding = "rteb.evaluate_agentic_coding:main"

[tool.setuptools.packages.find]
include = ["rteb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
